name: Playback checks

on:
  push:
    paths:
      - '**/*.html'
      - 'tests/**'
      - '.github/workflows/playback-checks.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'tests/**'
      - '.github/workflows/playback-checks.yml'

permissions:
  contents: read

jobs:
  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/playback.test.cjs
